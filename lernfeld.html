    <script>
      (function () {
        var t =
            window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light",
          a = "blue";
        try {
          t = JSON.parse(localStorage.getItem("fisi.theme")) || t;
          a = JSON.parse(localStorage.getItem("fisi.accent")) || a;
        } catch (e) {}
        try {
          if (window.name && window.name.indexOf("fisiStore:") === 0) {
            var m = JSON.parse(window.name.slice(10));
            if (m && m.theme) t = m.theme;
            if (m && m.accent) a = m.accent;
          }
        } catch (e) {}
        var f = "0",
          tr = "fisi";
        try {
          f = String(JSON.parse(localStorage.getItem("fisi.fontsize")) || "0");
          tr = JSON.parse(localStorage.getItem("fisi.track")) || tr;
        } catch (e) {}
        try {
          if (window.name && window.name.indexOf("fisiStore:") === 0) {
            var m2 = JSON.parse(window.name.slice(10));
            if (m2 && m2.fontsize != null) f = String(m2.fontsize);
            if (m2 && m2.track) tr = m2.track;
          }
        } catch (e) {}
        var d = document.documentElement;
        d.dataset.theme = t === "light" ? "light" : "dark";
        d.dataset.accent = a === "gold" || a === "blau" ? a : "blue";
        d.dataset.fs = f === "1" || f === "2" ? f : "0";
        var lb = null,
          kt = null;
        try {
          lb = JSON.parse(localStorage.getItem("fisi.lesbar"));
          kt = JSON.parse(localStorage.getItem("fisi.kontrast"));
        } catch (e) {}
        if (kt == null)
          kt = window.matchMedia && matchMedia("(prefers-contrast: more)").matches ? "1" : "0";
        d.dataset.lesbar = lb === "1" ? "1" : "0";
        d.dataset.kontrast = kt === "1" ? "1" : "0";
        d.className += " js";
        window.AKTIVE_TRACKS = ["fisi", "ae"];
        d.dataset.track = { ae: 1 }[tr] ? tr : "fisi";
      })();
    </script>

      function renderBlocks(blocks) {
        return blocks
          .map((b) => {
            if (b.type === "heading") return `<h4>${esc(b.value)}</h4>`;
            if (b.type === "text") return `<p>${esc(b.value)}</p>`;
            if (b.type === "list")
              return `<ul>${(b.value || []).map((v) => `<li>${esc(v)}</li>`).join("")}</ul>`;
            if (b.type === "note")
              return `<div class="note"><strong>Merke:</strong> ${esc(b.value)}</div>`;
            if (b.type === "code") return `<pre><code>${esc(b.value)}</code></pre>`;
            if (b.type === "links")
              return `<p class="lf-links fs-90">Weiterlesen: ${(b.value || []).map((l) => `<a href="${l[1]}" target="_blank" rel="noopener">${esc(l[0])}</a>`).join(" · ")}</p>`;
            if (b.type === "solution")
              return `<details class="solution"><summary>Musterlösung anzeigen</summary><pre style="background:transparent;color:inherit;padding:6px 0">${esc(b.value)}</pre></details>`;
            return "";
          })
          .join("");
      }

        <span class="badge ap">Prüfungsrelevant: ${m.ap}</span>
        <span class="badge">${m.lessons} Lektionen</span><span class="badge">${m.quiz} Fragen</span>
        <span class="status-pill ${stClsMap[st]}">${st}</span>
      </div>
      <h1>${m.nr}: ${m.name}</h1>
      ${schoolNote ? `<p style="font-size:.83rem;color:var(--tx3)">${schoolNote}</p>` : ""}
    </div>

    <div class="card mb-16">
      ${
        meta
          ? `
      <div class="callout simple"><span class="ct">Einfach erklärt</span><p>${meta.intro}</p></div>
      <div class="callout deep"><span class="ct">Technische Vertiefung</span><p>${meta.deep}</p></div>
      <div class="callout"><span class="ct">Typische berufliche Handlungssituation</span><p>${meta.situation}</p></div>
      <div class="grid c2 mt-14">
        <div><h2 class="fs-105">Lernziele &amp; Kompetenzen</h2><ul>${meta.goals.map((g) => `<li>${g}</li>`).join("")}</ul></div>
        <div><h2 class="fs-105">Häufige Fehler</h2><ul>${meta.mistakes.map((g) => `<li>${g}</li>`).join("")}</ul>
        ${meta.terms.length ? `<h2 class="fs-105">Fachbegriffe</h2><p>${meta.terms.map((t) => `<a href="glossar.html?q=${encodeURIComponent(t)}">${t}</a>`).join(" · ")}</p>` : ""}</div>
      </div>
      <p><strong>Praxisbeispiel:</strong> ${meta.praxis}</p>
      <div class="callout deep" style="border-color:var(--err);background:rgba(210,59,59,.06)"><span class="ct">Prüfungshinweis</span>${meta.apNote}</div>
      <p>${meta.cross
        .map((c) => {
          const cm = LF.meta(c.lf);
          return `<a class="crossref" href="lernfeld.html?id=${c.lf}">${c.label}${cm ? " (" + cm.nr + ")" : ""}</a>`;
        })
        .join("")}</p>
      ${meta.links.length ? `<p class="hint">Weiterführend: ${meta.links.map((l) => `<a href="${l[1]}" rel="noopener">${l[0]}</a>`).join(" · ")}</p>` : ""}
      `
          : ""
      }
    </div>

    <div class="card mb-16">
      <h2>Visualisierung</h2>
      <figure class="viz-figure">
        ${meta && VIZ[meta.viz] ? VIZ[meta.viz]() : VIZ.pruefung()}
        <figcaption>Eigene Darstellung (FISI-HQ, SVG) – funktioniert im hellen und dunklen Modus und mit beiden Akzentfarben. [Interne Quelle: eigene Grafik]</figcaption>
      </figure>
      ${window.LF_EXTRA_VIZ && LF_EXTRA_VIZ[fid] ? LF_EXTRA_VIZ[fid].map(renderTopicViz).join("") : ""}
      <div id="wiki-slots-lf" class="grid c2 mt-10"></div>
    </div>

    <div class="card mb-16">
      <h2>Dein Fortschritt in ${m.nr}</h2>
      <div class="progress" role="img" aria-label="Fortschritt ${pct} Prozent"><span style="width:${pct}%"></span></div>
      <p style="font-size:.9rem;margin-top:8px">${LF.read(fid).length}/${m.lessons} Lektionen gelesen · ${s.answered} Antworten (${s.answered ? s.pct + " % richtig" : "–"}) · ${s.openWrong} offene Wiederholung(en)</p>
      <p style="font-size:.85rem;color:var(--tx3);margin:6px 0" id="lf-selfsum"></p>
      <div class="q-actions">
        <button class="btn" id="lf-quiz-btn">${m.nr}-Quiz starten (10 Fragen)</button>
        <button class="btn ghost" id="lf-blitz-btn">Blitz-Runde: 5 Fragen in 60 s</button>
        <button class="btn ghost" id="lf-pairs-btn" hidden>Begriffe zuordnen</button>
        ${s.openWrong ? `<a class="btn ghost" href="quiz.html?mode=repeat">Wiederholungen zuerst</a>` : ""}
        <span class="q-progress" id="lf-next-step"></span>
      </div>
      <div id="lf-quiz-host" class="mt-14"></div>
      <div id="lf-blitz-host" class="mt-14"></div>
      <div id="lf-pairs-host" class="mt-14"></div>
    </div>

    <div class="card" id="lf-station-wrap" class="mb-16" hidden>
      <h2>Labor-Station zu diesem Lernfeld</h2>
      <div id="lf-station-host"></div>
    </div>

    ${
      relatedLessons.length ||
      relatedCards.length ||
      relatedMissions.length ||
      relatedShorts.length ||
      relatedZoom.length
        ? `
    <div class="card mb-16">
      <h2>Passende Inhalte der Plattform</h2>
      ${relatedLessons.length ? `<p><strong>Kern-Lektionen:</strong> ${relatedLessons.map((l) => `<a href="lektion.html?id=${l.id}">${l.title}</a>`).join(" · ")}</p>` : ""}
      ${relatedZoom.length ? `<p><strong>Passende Laborübung:</strong> ${relatedZoom.map((z) => `<a href="labor.html">Zoom-Ebene ${z.id}: ${z.name}</a>`).join(" · ")}</p>` : ""}
      ${relatedMissions.length ? `<p><strong>Missionen:</strong> ${relatedMissions.map((x) => `<a href="${x.link}">${x.title}</a>`).join(" · ")}</p>` : ""}
      ${relatedShorts.length ? `<p><strong>Lern-Snacks:</strong> ${relatedShorts.map((x) => `<a href="shorts.html">${x.topic}</a>`).join(" · ")}</p>` : ""}
      ${relatedCards.length ? `<p><strong>Lernkarten:</strong> <a href="lernkarten.html">${relatedCards.length} passende Karte(n)</a></p>` : ""}
    </div>`
        : ""
    }

    <div class="card">
      ${
        (window.merkFuer ? merkFuer({ lf: fid }) : []).length
          ? `<h2>Merkhilfen zu diesem Lernfeld</h2>${merkFuer({ lf: fid })
              .map((m) => `<div class="callout merk"><span class="ct">${m.t}</span>${m.txt}</div>`)
              .join("")}`
          : ""
      }
      <h2>Lektionen</h2>
      <p class="hint">Aufklappen markiert die Lektion als gelesen.</p>
      <div id="lf-topics"><p class="empty">Inhalte werden geladen…</p></div>
    </div>`;

        // Echte Fotos (Wikimedia, Zwei-Klick)
        if (window.WIKI_SLOTS && WIKI_SLOTS[fid]) {
          const wrap = document.getElementById("wiki-slots-lf");
          WIKI_SLOTS[fid].forEach((t) => {
            const d = document.createElement("div");
            wrap.appendChild(d);
            renderWikiSlot(d, t);
          });
        }

        // Hilfreiche Videos (Zwei-Klick ueber youtube-nocookie, wie die Wikimedia-Bilder)
        if (window.renderVideoSlot) {
          const wrap = document.getElementById("wiki-slots-lf");
          ((window.VIDEO_SLOTS && VIDEO_SLOTS.lf[fid]) || []).forEach((v) => {
            const d = document.createElement("div");
            wrap.appendChild(d);
            renderVideoSlot(d, v);
          });
          const sl = document.createElement("p");
          sl.style.cssText = "font-size:.85rem;margin:6px 0 0";
          sl.innerHTML =
            '<a href="' +
            videoSearchLink(m.nr + " " + m.name) +
            '" target="_blank" rel="noopener">Weitere Videos zu diesem Lernfeld auf YouTube suchen</a>';
          wrap.appendChild(sl);
        }

        // Nächster Schritt
        const nextStepEl = document.getElementById("lf-next-step");
        if (s.openWrong) nextStepEl.textContent = "Empfehlung: erst Wiederholungen abbauen.";
        else nextStepEl.textContent = "Empfehlung: nächste ungelesene Lektion unten öffnen.";

        // Import-Inhalte laden (mit Fehlerbehandlung)
        LF.load(fid)
          .then((content) => {
            const read = LF.read(fid);
            document.getElementById("lf-topics").innerHTML = content.topics
              .map(
                (t) => `
      <h3 class="mt-16" id="t-${t.id}">${esc(t.title)} <span class="badge">${t.lessons.length} Lektionen</span></h3>
      ${t.lessons
        .map(
          (l) => `
        <details class="lf-lesson" id="${l.id}" data-lesson="${l.id}">
          <summary>${read.includes(l.id) ? "✓ " : ""}${esc(l.title)} <span class="badge" style="margin-left:auto">${l.quiz.length} Fragen</span></summary>
          <div class="lf-lesson-body hat-tts">
            ${window.Vorlesen ? '<button type="button" class="tts-btn tts-ecke" aria-pressed="false" aria-label="Lektion mit der Browser-Stimme vorlesen lassen" title="Lektion vorlesen (nochmal klicken = Stopp)">▶</button>' : ""}
            <div class="content-block">${renderBlocks(l.content)}</div>
            <div class="lf-wiki-lesson" data-t="${esc(l.title)}" data-topic="${esc(t.title)}"></div>
            <div class="lf-video-lesson" data-id="${l.id}" data-t="${esc(l.title)}" data-topic="${esc(t.title)}"></div>
            <div class="selfcheck" data-sid="${l.id}" role="group" aria-label="Selbsteinschätzung">
              <span>Selbstcheck:</span>
              <button type="button" data-v="1">Sicher</button><button type="button" data-v="2">Unsicher</button><button type="button" data-v="3">Nochmal</button>
            </div>
            <details class="lf-note-wrap" style="margin:8px 0"><summary style="cursor:pointer;font-size:.85rem;color:var(--tx2)">Meine Notizen zu dieser Lektion</summary><textarea class="lf-note" data-nid="${l.id}" rows="3" style="width:100%;margin-top:6px;background:var(--bg2);color:var(--tx);border:1px solid var(--line-strong);border-radius:3px;padding:8px;font-family:var(--font);font-size:.9rem" placeholder="Eigene Merksätze …"></textarea></details>
            ${l.quiz.length ? `<button class="btn small" data-lquiz="${l.id}">Fragen zu dieser Lektion üben (${Math.min(5, l.quiz.length)})</button><div class="lquiz-host mt-10"></div>` : ""}
          </div>
        </details>`
        )
        .join("")}`
              )
              .join("");
            // Themen-Klickpunkte oben ("Direkt zu"): ein Klick springt zum Thema
            if (window.buildJumpNav) {
              const old = document.getElementById("jump-nav");
              if (old) old.remove();
              buildJumpNav(content.topics.map((t) => ({ id: "t-" + t.id, label: t.title })));
            }

            const allQ = LF.questions(fid, content);
            // Lektion als gelesen markieren + Lektions-Quiz
            document.querySelectorAll("details.lf-lesson").forEach((d) => {
              d.addEventListener("toggle", () => {
                if (d.open) {
                  LF.markRead(fid, d.dataset.lesson);
                  Store.set("lastLfLesson", d.dataset.lesson);
                }
              });
            });
            // Bild-Kachel je Lektion (Zwei-Klick, Suchbegriff aus dem Titel abgeleitet)
            if (window.initVizCommons) initVizCommons();
            if (window.renderWikiSlot && window.lessonSearchTerm) {
              document.querySelectorAll(".lf-wiki-lesson").forEach((el) => {
                const title = el.dataset.t;
                const term = lessonSearchTerm(title, el.dataset.topic, fid);
                if (!term) {
                  el.remove();
                  return;
                } // kein passendes Bild bekannt -> weglassen
                renderWikiSlot(el, {
                  label: "Passendes Bild: " + title,
                  search: term,
                  alt: "Foto zum Thema " + title,
                });
              });
            }
            // Videos je Import-Lektion: bis zu 2 Treffer, sonst garantiert das Lernfeld-Video
            if (window.videosFuer && window.renderVideoSlot) {
              document.querySelectorAll(".lf-video-lesson").forEach((el) => {
                // Kuratierte Videos je Lektion haben Vorrang vor dem Keyword-Matching
                let vs = (window.VIDEO_SLOTS.lessons[el.dataset.id] || []).slice(0, 2);
                if (!vs.length) vs = videosFuer(el.dataset.t, el.dataset.topic);
                if (!vs.length && window.VIDEO_SLOTS.lf[fid]) vs = [VIDEO_SLOTS.lf[fid][0]];
                if (!vs.length) {
                  el.remove();
                  return;
                }
                vs.forEach((v) => {
                  const d = document.createElement("div");
                  el.appendChild(d);
                  renderVideoSlot(d, v);
                });
              });
            }
            // Notizen je Import-Lektion (lazy laden beim Aufklappen, speichern mit Verzoegerung)
            document.querySelectorAll(".lf-note").forEach((ta) => {
              ta.value = Store.get("note_" + ta.dataset.nid, "");
              let t = null;
              ta.addEventListener("input", () => {
                clearTimeout(t);
                t = setTimeout(
                  () => Store.set("note_" + ta.dataset.nid, ta.value.slice(0, 4000)),
                  500
                );
              });
            });
            document.querySelectorAll("[data-lquiz]").forEach((b) =>
              b.addEventListener("click", () => {
                const pool = shuffle(allQ.filter((q) => q.lesson === b.dataset.lquiz)).slice(0, 5);
                runQuiz(pool, b.nextElementSibling);
              })
            );
            // Selbstcheck je Lektion (persistiert, Zusammenfassung oben)
            const RATE_TXT = { 1: "sicher", 2: "unsicher", 3: "nochmal" };
            function selfSum() {
              const c = { 1: 0, 2: 0, 3: 0 };
              content.topics.forEach((t) =>
                t.lessons.forEach((l) => {
                  const v = Store.get("rate_" + l.id, 0);
                  if (c[v] !== undefined) c[v]++;
                })
              );
              document.getElementById("lf-selfsum").textContent =
                "Selbstcheck: " +
                c[1] +
                " sicher · " +
                c[2] +
                " unsicher · " +
                c[3] +
                " nochmal · " +
                (m.lessons - c[1] - c[2] - c[3]) +
                " offen";
            }
            document.querySelectorAll(".selfcheck").forEach((sc) => {
              const sid = sc.dataset.sid;
              const paint = () => {
                const v = Store.get("rate_" + sid, 0);
                sc.querySelectorAll("button").forEach((b) =>
                  b.setAttribute("aria-pressed", +b.dataset.v === v)
                );
              };
              sc.querySelectorAll("button").forEach((b) =>
                b.addEventListener("click", () => {
                  Store.set("rate_" + sid, +b.dataset.v);
                  paint();
                  selfSum();
                })
              );
              paint();
            });
            selfSum();

            // Labor-Station: eigener Simulator oder Verweis-Kachel je Lernfeld
            if (
              window.mountStation &&
              mountStation(fid, document.getElementById("lf-station-host"))
            )
              document.getElementById("lf-station-wrap").hidden = false;

            // Blitz-Runde: 5 Fragen aus diesem Lernfeld gegen 60 Sekunden
            document.getElementById("lf-blitz-btn").addEventListener("click", function () {
              this.disabled = true;
              const host = document.getElementById("lf-blitz-host");
              const pool = shuffle(allQ).slice(0, 5);
              let bi = 0,
                bok = 0,
                left = 60;
              host.innerHTML =
                '<p class="fw-600">Blitz-Runde · <span id="blitz-t" class="mono">60 s</span> · <span id="blitz-p">0/5</span></p><div id="blitz-q"></div>';
              const tEl = host.querySelector("#blitz-t");
              const iv = setInterval(() => {
                left--;
                tEl.textContent = left + " s";
                if (left <= 0) done();
              }, 1000);
              const done = () => {
                clearInterval(iv);
                const best = Math.max(Store.get("lfBlitz_" + fid, 0), bok);
                Store.set("lfBlitz_" + fid, best);
                host.innerHTML =
                  '<div class="callout"><span class="ct">Blitz-Runde beendet</span>' +
                  bok +
                  " von " +
                  bi +
                  " beantworteten Fragen richtig" +
                  (left <= 0 ? " – die Zeit war um." : ".") +
                  " Bestwert: " +
                  best +
                  "/5.</div>";
                document.getElementById("lf-blitz-btn").disabled = false;
                if (bok >= 4) Gami.addXp(15, "Blitz-Runde " + m.nr + ": " + bok + "/5");
              };
              const next = () => {
                if (bi >= 5 || left <= 0) return done();
                host.querySelector("#blitz-p").textContent = bi + "/5";
                renderQuestion(pool[bi], host.querySelector("#blitz-q"), {
                  onAnswered(ok) {
                    if (ok) bok++;
                    bi++;
                    setTimeout(next, 700);
                  },
                });
              };
              next();
            });

            // Begriffe zuordnen: automatisch aus den Lernkarten dieses Lernfelds
            (function () {
              const cards = DATA.cards.filter((c) => (c.lf || []).includes(fid));
              if (cards.length < 4) return;
              const btn = document.getElementById("lf-pairs-btn");
              btn.hidden = false;
              btn.addEventListener("click", () => {
                const pick = shuffle(cards.slice()).slice(0, 4);
                const cut = (x, n) => (x.length > n ? x.slice(0, n - 1) + "…" : x);
                renderQuestion(
                  {
                    id: "pairs_" + fid,
                    topic: m.nr + " – Begriffe",
                    rel: "med",
                    type: "match",
                    q: "Ordne jedem Begriff die passende Erklärung zu.",
                    pairs: pick.map((c) => ({ l: cut(c.f, 60), r: cut(c.b, 80) })),
                    explain: "Die vollständigen Erklärungen findest du auf den Lernkarten.",
                    xp: 10,
                  },
                  document.getElementById("lf-pairs-host"),
                  {}
                );
              });
            })();

            // LF-Quiz: Import + Basisfragen gemischt
            document.getElementById("lf-quiz-btn").addEventListener("click", function () {
              this.disabled = true;
              const pool = shuffle(allQ.concat(LF.baseQuestions(fid))).slice(0, 10);
              runQuiz(pool, document.getElementById("lf-quiz-host"), {
                onDone: () => {
                  this.disabled = false;
                },
              });
              document.getElementById("lf-quiz-host").scrollIntoView({ behavior: "smooth" });
            });
            // Anker öffnen
            if (location.hash) {
              const el = document.getElementById(location.hash.slice(1));
              if (el && el.tagName === "DETAILS") {
                el.open = true;
                el.scrollIntoView();
              }
            }
          })
          .catch((err) => {
            document.getElementById("lf-topics").innerHTML =
              `<div class="q-feedback bad" role="alert"><strong>Inhalte konnten nicht geladen werden.</strong> ${esc(err.message)}<br>Prüfe, ob der Ordner <code>assets/data/</code> vollständig ist, oder erzeuge die Datenmodule neu mit <code>python3 scripts/import_content.py</code>.</div>`;
            document.getElementById("lf-quiz-btn").addEventListener("click", function () {
              const pool = shuffle(LF.baseQuestions(fid)).slice(0, 10);
              if (!pool.length) {
                toast("Keine Fragen verfügbar.");
                return;
              }
              runQuiz(pool, document.getElementById("lf-quiz-host"));
            });
          });
      };
    </script>
  </body>
</html>
